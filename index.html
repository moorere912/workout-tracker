<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Workout Tracker</title>
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Workouts" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./css/styles.css" />

<div id="app">
  <div class="update-banner" id="updateBanner">An update is ready — tap to refresh</div>

  <main id="screens">
    <section class="screen" id="screen-programs"></section>
    <section class="screen" id="screen-programDetail"></section>
    <section class="screen" id="screen-workout"></section>
    <section class="screen" id="screen-history"></section>
    <section class="screen" id="screen-progress"></section>
    <section class="screen" id="screen-settings"></section>
  </main>

  <div class="continue-bar" id="continueBar">
    <div>
      <strong>Workout in progress</strong><br />
      <span id="continueBarSub">Tap to continue</span>
    </div>
    <span>&rarr;</span>
  </div>

  <div class="rest-timer-bar" id="restTimerBar">
    <div>
      <span class="rest-timer-label">Rest</span><br />
      <strong id="restTimerVal">0:00</strong>
    </div>
    <button type="button" id="restSkipBtn" class="btn ghost">Skip</button>
  </div>

  <nav class="tabbar">
    <button data-tab="programs"><span class="icon">&#128170;</span>Programs</button>
    <button data-tab="history"><span class="icon">&#128197;</span>History</button>
    <button data-tab="progress"><span class="icon">&#128200;</span>Progress</button>
    <button data-tab="settings"><span class="icon">&#9881;</span>Settings</button>
  </nav>
</div>

<script type="module" src="./js/app.js"></script>
